name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  typescript:
    name: TypeScript (formato, typecheck, lint, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # Caché de Turborepo entre corridas: solo se repiten las tareas de los paquetes que cambiaron.
      - uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      # Archivos, exports y dependencias sin uso (knip.json lista las excepciones conocidas).
      - run: pnpm knip
      - run: pnpm check

  e2e:
    name: E2E (Playwright y axe sobre los builds)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @blindaje/landing build
      - run: pnpm --filter @blindaje/portal run build:mock
      - run: pnpm --filter @blindaje/console run build:mock
      - run: pnpm --filter @blindaje/e2e exec playwright install --with-deps chromium
      - run: pnpm --filter @blindaje/e2e e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-trazas
          path: e2e/test-results
          retention-days: 7

  mobile:
    name: App móvil (lint, typecheck, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - run: npm ci
      # La copia de packages/shared en src/shared debe estar al día con el original.
      - run: npm run sync-shared -- --check
      - run: npm run lint
      - run: npm run knip
      - run: npm run typecheck
      - run: npm test -- --ci

  ml:
    name: Contenedor ML (ruff, pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/ml
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg libpango-1.0-0 libpangoft2-1.0-0
      - run: uv sync --extra dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -m "not heavy" -q
      # Scripts de evaluación en Python: solo estilo (sus dependencias incluyen torch).
      - run: uvx ruff check . && uvx ruff format --check .
        working-directory: eval/py
