# CI en GitLab: los mismos controles que .github/workflows/ci.yml (formato, knip, typecheck, lint,
# tests, e2e con Playwright y axe, la app móvil y el contenedor ML) y el APK de Android a pedido,
# como .github/workflows/android.yml. El despliegue sigue en GitHub Actions o a mano (docs/DEPLOY.md).
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

stages: [check, apk]

default:
  interruptible: true

.pnpm:
  image: node:22-bookworm
  before_script:
    - corepack enable
    - pnpm config set store-dir .pnpm-store
    - pnpm install --frozen-lockfile
  cache:
    - key:
        files: [pnpm-lock.yaml]
      paths: [.pnpm-store]
    # Caché de Turborepo: solo se repiten las tareas de los paquetes que cambiaron.
    - key: turbo-$CI_COMMIT_REF_SLUG
      paths: [.turbo]

typescript:
  extends: .pnpm
  stage: check
  script:
    - pnpm format:check
    - pnpm knip
    - pnpm check

e2e:
  extends: .pnpm
  stage: check
  script:
    - pnpm --filter @blindaje/landing build
    - pnpm --filter @blindaje/portal run build:mock
    - pnpm --filter @blindaje/console run build:mock
    - pnpm --filter @blindaje/e2e exec playwright install --with-deps chromium
    - pnpm --filter @blindaje/e2e e2e
  artifacts:
    when: on_failure
    paths: [e2e/test-results]
    expire_in: 7 days

mobile:
  image: node:22-bookworm
  stage: check
  cache:
    key:
      files: [apps/mobile/package-lock.json]
    paths: [apps/mobile/.npm]
  script:
    - cd apps/mobile
    - npm ci --cache .npm --prefer-offline
    # La copia de packages/shared en src/shared debe estar al día con el original.
    - npm run sync-shared -- --check
    - npm run lint
    - npm run knip
    - npm run typecheck
    - npm test -- --ci

ml:
  image: ghcr.io/astral-sh/uv:python3.11-bookworm-slim
  stage: check
  variables:
    UV_CACHE_DIR: $CI_PROJECT_DIR/.uv-cache
  cache:
    key:
      files: [services/ml/uv.lock]
    paths: [.uv-cache]
  script:
    - apt-get update && apt-get install -y --no-install-recommends ffmpeg libpango-1.0-0 libpangoft2-1.0-0
    - cd services/ml
    - uv sync --extra dev
    - uv run ruff check .
    - uv run ruff format --check .
    - uv run pytest -m "not heavy" -q
    # Scripts de evaluación en Python: solo estilo (sus dependencias incluyen torch).
    - cd ../../eval/py && uvx ruff@0.17.3 check . && uvx ruff@0.17.3 format --check .

# APK de Android a pedido (botón de play en el pipeline de main): release firmado con la llave de
# depuración de la plantilla de Expo, compilado aquí y no en la máquina del equipo.
#   cuaderno.apk       prevención de capturas activa: así se usaría de verdad.
#   cuaderno-demo.apk  permite capturas y grabar pantalla (solo para el video y la landing), llena
#                      el cuaderno con ventas ficticias y se registra en el mundo demo de la base.
#                      Nunca para personas reales. Trae también x86_64
#                      para abrir en un emulador: con solo ARM, SoLoader busca lib/x86_64 y la app se cierra.
apk:
  stage: apk
  image: eclipse-temurin:21-jdk-noble
  tags: [saas-linux-medium-amd64]
  timeout: 90m
  needs: []
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
      allow_failure: true
  parallel:
    matrix:
      - NOMBRE: cuaderno
        ABIS: arm64-v8a,armeabi-v7a
        EXPO_PUBLIC_ALLOW_SCREENSHOTS: "0"
        EXPO_PUBLIC_DEMO_SEED: "0"
      - NOMBRE: cuaderno-demo
        ABIS: arm64-v8a,armeabi-v7a,x86_64
        EXPO_PUBLIC_ALLOW_SCREENSHOTS: "1"
        EXPO_PUBLIC_DEMO_SEED: "1"
  variables:
    EXPO_NO_TELEMETRY: "1"
    EXPO_PUBLIC_API_URL: https://blindaje-api.vigiaperu.workers.dev
    ANDROID_HOME: /opt/android-sdk
    NODE_VERSION: "22.23.4"
  cache:
    key:
      files: [apps/mobile/package-lock.json]
    paths: [apps/mobile/.npm]
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends curl git unzip xz-utils
    - curl -fsSL https://nodejs.org/dist/v$NODE_VERSION/node-v$NODE_VERSION-linux-x64.tar.xz | tar -xJ -C /opt
    - export PATH="/opt/node-v$NODE_VERSION-linux-x64/bin:$PATH"
    - curl -fsSL -o /tmp/tools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
    - mkdir -p $ANDROID_HOME/cmdline-tools && unzip -q /tmp/tools.zip -d $ANDROID_HOME/cmdline-tools
    - mv $ANDROID_HOME/cmdline-tools/cmdline-tools $ANDROID_HOME/cmdline-tools/latest
    # Con las licencias aceptadas, Gradle baja la plataforma, las build-tools, el NDK y CMake que pide
    # React Native.
    - (yes || true) | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null
  script:
    - cd apps/mobile
    - npm ci --cache .npm --prefer-offline
    - npx expo prebuild --platform android --no-install --clean
    - cd android && ./gradlew assembleRelease -PreactNativeArchitectures=$ABIS --no-daemon
    - cp app/build/outputs/apk/release/app-release.apk ../$NOMBRE.apk
  artifacts:
    name: $NOMBRE
    paths: [apps/mobile/$NOMBRE.apk]
    expire_in: 30 days
